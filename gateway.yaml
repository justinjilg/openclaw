###############################################################################
# OpenClaw Gateway — Hardened Configuration
#
# Docs: https://docs.openclaw.ai/gateway/security
###############################################################################

gateway:
  # --- Network Binding ---
  # "loopback" = localhost only. Never use "lan" or "0.0.0.0" without auth.
  bind: "loopback"

  # --- Authentication ---
  # Token is read from OPENCLAW_GATEWAY_TOKEN env var (set in .env / 1Password).
  # Non-loopback binds will refuse to start without auth configured.
  auth:
    # Uncomment if using Tailscale:
    # allowTailscale: true
    # password: set-via-env-var

  # --- Control UI ---
  controlUi:
    enabled: true
    # Since we bind to loopback, origin checks are skipped automatically.
    # If you ever switch to "lan", you MUST set allowedOrigins explicitly:
    # allowedOrigins:
    #   - "https://your-domain.example.com"
    #
    # NEVER enable this in production:
    # dangerouslyAllowHostHeaderOriginFallback: false

  # --- Tool Execution ---
  exec:
    # Default-deny: require explicit approval for tool invocations.
    # The agent must ask before running shell commands, file writes, etc.
    approvalMode: "always"
    # Allowed directories for file operations (restrict blast radius)
    allowedPaths:
      - "/home/node/workspace"
      - "/home/node/projects"  # Cross-project read access (volume is :ro)
    # Block dangerous commands even if approved
    blockedCommands:
      - "rm -rf /"
      - "rm -rf /*"
      - "mkfs"
      - "dd if="
      - "shutdown"
      - "reboot"
      - "curl|sh"
      - "curl|bash"
      - "wget|sh"
      - "wget|bash"
      - "pip install"
      - "npm install -g"
      - "npx"
      - "chmod 777"
      - "chown root"

  # --- DM Policy ---
  dm:
    # Only process messages from explicitly allowed contacts.
    # Add trusted contacts here — everyone else is ignored.
    policy: "allowlist"
    allowlist: []
    # allowlist:
    #   - "+1234567890"          # Phone number (WhatsApp/Signal/iMessage)
    #   - "username@telegram"    # Telegram handle
    #   - "user@slack-workspace" # Slack user

  # --- SSRF Protection ---
  network:
    # Block requests to private/internal networks from skills/tools
    blockPrivateNetworks: true
    # Allowlist specific internal hosts if needed:
    # allowedInternalHosts:
    #   - "192.168.1.100"

  # --- MCP Servers ---
  mcp:
    servers:
      brainstormrouter:
        transport: "streamable-http"
        url: "https://api.brainstormrouter.com/v1/mcp/connect"
        headers:
          Authorization: "Bearer ${BRAINSTORMROUTER_ADMIN_KEY}"
        # 19 tools exposed — restrict per-agent via tools.allow/deny in openclaw.json
        # Full list: br_route_completion, br_list_models, br_get_usage, br_set_alias,
        #   br_get_health, br_memory_list, br_memory_store, br_memory_query,
        #   br_list_prompts, br_list_presets, br_get_ops_status, br_get_insights,
        #   br_get_governance, br_list_agents, br_get_leaderboard,
        #   br_bootstrap_agent, br_agent_status, br_agent_limits, br_agent_anomaly

  # --- Skills ---
  skills:
    # Only load skills from the workspace — no auto-install from ClawHub
    autoInstall: false
    # Pin versions to prevent supply chain attacks
    pinVersions: true
    # Skills directory (workspace takes highest precedence)
    directories:
      - "/home/node/workspace/skills"

  # --- Memory & Privacy ---
  memory:
    # Store memory locally only — no cloud sync
    provider: "local"
    path: "/home/node/.openclaw/memory"

  # --- LLM Providers ---
  models:
    providers:
      brainstormrouter:
        baseUrl: "https://api.brainstormrouter.com/v1"
        apiKey: "${BRAINSTORMROUTER_API_KEY}"
        api: "openai-completions"
      moonshot:
        baseUrl: "https://api.moonshot.ai/v1"
        apiKey: "${MOONSHOT_API_KEY}"
        api: "openai-completions"

  # --- Multi-Agent ---
  # Agent-specific config (tools, budgets, models) is in ~/.openclaw/openclaw.json.
  # Gateway-level defaults below apply as fallback.
  agents:
    defaults:
      model:
        primary: "moonshot/kimi-k2.5"
        fallback: "moonshot/kimi-k2.5"

  session:
    dmScope: "per-channel-peer"

  # --- Logging ---
  logging:
    level: "info"
    # Don't log message content (privacy)
    redactMessages: true
